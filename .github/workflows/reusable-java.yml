name: Reusable Java CI

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  java-ci:
    name: Java quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - name: Проверить Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Сборка и тесты
        run: ./gradlew clean check --no-daemon
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: ${{ inputs.working-directory }}/build/reports/tests
          if-no-files-found: ignore
