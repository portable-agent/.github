name: Reusable security

on:
  workflow_call:
    inputs:
      trivy-ignore-file:
        type: string
        default: ""
        description: "Путь к проверенному файлу исключений Trivy внутри вызывающего репозитория."

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Найти случайно добавленные секреты
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose /github/workspace
      - name: Проверить файлы и IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ inputs.trivy-ignore-file }}
          version: v0.74.0

