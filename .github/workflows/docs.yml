name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверить режимы container workflow
        shell: pwsh
        run: ./scripts/check-workflows.ps1
      - name: Проверить GitHub Actions
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 -color
  docs:
    uses: ./.github/workflows/reusable-docs.yml
